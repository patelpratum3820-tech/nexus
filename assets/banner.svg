<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10"/>
      <stop offset="50%" stop-color="#0d101c"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="bannerGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgDark)"/>
  <circle cx="240" cy="200" r="300" fill="url(#bannerGlow)"/>

  <!-- Subtle Grid Overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Left: Geometric Logo Mark -->
  <g transform="translate(90, 80) scale(0.47)">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#2e285a" stroke-width="3" stroke-dasharray="6 10" opacity="0.7"/>
    <polygon points="256,76 396,156 396,356 256,436 116,356 116,156" fill="#131627" stroke="#8b5cf6" stroke-width="6" stroke-linejoin="round"/>
    <line x1="256" y1="130" x2="256" y2="256" stroke="#c4b5fd" stroke-width="5"/>
    <line x1="256" y1="256" x2="156" y2="256" stroke="#38bdf8" stroke-width="5"/>
    <line x1="256" y1="256" x2="356" y2="256" stroke="#38bdf8" stroke-width="5"/>
    <line x1="256" y1="256" x2="196" y2="360" stroke="#8b5cf6" stroke-width="4"/>
    <line x1="256" y1="256" x2="316" y2="360" stroke="#8b5cf6" stroke-width="4"/>
    <circle cx="256" cy="130" r="14" fill="#c4b5fd"/>
    <circle cx="156" cy="256" r="12" fill="#38bdf8"/>
    <circle cx="356" cy="256" r="12" fill="#38bdf8"/>
    <circle cx="196" cy="360" r="11" fill="#818cf8"/>
    <circle cx="316" cy="360" r="11" fill="#818cf8"/>
    <circle cx="256" cy="256" r="32" fill="#0f172a" stroke="#a78bfa" stroke-width="5"/>
    <circle cx="256" cy="256" r="16" fill="#38bdf8"/>
    <circle cx="256" cy="256" r="7" fill="#ffffff"/>
  </g>

  <!-- Center-Right: Typography & Value Proposition -->
  <!-- Tagline Pill -->
  <rect x="380" y="95" width="280" height="30" rx="15" fill="url(#pillGrad)" stroke="#8b5cf6" stroke-width="1.2"/>
  <circle cx="396" cy="110" r="4" fill="#34d399"/>
  <text x="408" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd" letter-spacing="1.5">LOCAL-FIRST AI WORKSPACE</text>

  <!-- Title -->
  <text x="378" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="6">NEXUS</text>

  <!-- Subtitle -->
  <text x="380" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    Privacy-Centric Desktop Operating Workspace with Hardware-Aware Local AI Execution
  </text>

  <!-- Feature Tags / Architecture Metrics -->
  <g transform="translate(380, 260)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="#131627" stroke="#2e285a" stroke-width="1"/>
    <text x="12" y="21" font-family="monospace" font-size="11" fill="#c4b5fd">⚛ React 19 + Electron</text>

    <!-- Tag 2 -->
    <rect x="177" y="0" width="165" height="34" rx="8" fill="#131627" stroke="#2e285a" stroke-width="1"/>
    <text x="189" y="21" font-family="monospace" font-size="11" fill="#38bdf8">⚡ FastAPI Core Backend</text>

    <!-- Tag 3 -->
    <rect x="354" y="0" width="175" height="34" rx="8" fill="#131627" stroke="#2e285a" stroke-width="1"/>
    <text x="366" y="21" font-family="monospace" font-size="11" fill="#34d399">🛡 2 GB Guarded Reserve</text>

    <!-- Tag 4 -->
    <rect x="541" y="0" width="185" height="34" rx="8" fill="#131627" stroke="#2e285a" stroke-width="1"/>
    <text x="553" y="21" font-family="monospace" font-size="11" fill="#f472b6">🦙 Ollama Stream Engine</text>
  </g>
</svg>
